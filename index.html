<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Aviator Game Engine</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            margin: auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
        }

        input,
        button {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: none;
        }

        button {
            background: #22c55e;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #game-screen {
            font-size: 3rem;
            margin: 20px 0;
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container" id="auth-box">
        <h2>Login / Register</h2>
        <input type="text" id="username" placeholder="Maqaa Fayyadamaa (Username)">
        <input type="password" id="password" placeholder="Jecha Icciitii (Password)">
        <button onclick="register()">Galmaa'i (Register)</button>
        <button onclick="login()" style="background:#3b82f6;">Seeni (Login)</button>
        <p id="auth-msg"></p>
    </div>

    <div class="container" id="game-box" style="display:none;">
        <h2>Baga Nagaan Dhuftan, <span id="user-display"></span></h2>
        <h3>Balance: $<span id="balance-display">0</span></h3>

        <div id="game-screen">1.00x</div>
        <p id="status-text">Qophaa'aa jira...</p>

        <hr>
        <h3>Kaffaltii (Telebirr / CBE)</h3>
        <select id="pay-method">
            <option value="Telebirr">Telebirr</option>
            <option value="CBE">Commercial Bank of Ethiopia (CBE)</option>
        </select>
        <input type="number" id="pay-amount" placeholder="Maallaqa (Amount)">
        <button onclick="processTransaction('deposit')" style="background: #10b981;">Galchi (Deposit)</button>
        <button onclick="processTransaction('withdraw')" style="background: #ef4444;">Baasi (Withdraw)</button>
        <p id="pay-msg"></p>
    </div>

    <script>
        const socket = io();
        let currentUser = null;

        async function register() {
            let u = document.getElementById('username').value;
            let p = document.getElementById('password').value;
            let res = await fetch('/api/register', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            let data = await res.json();
            document.getElementById('auth-msg').innerText = data.error || data.message;
        }

        async function login() {
            let u = document.getElementById('username').value;
            let p = document.getElementById('password').value;
            let res = await fetch('/api/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            let data = await res.json();
            if (data.success) {
                currentUser = data.username;
                document.getElementById('user-display').innerText = currentUser;
                document.getElementById('balance-display').innerText = data.balance;
                document.getElementById('auth-box').style.display = 'none';
                document.getElementById('game-box').style.display = 'block';
            } else {
                document.getElementById('auth-msg').innerText = data.error;
            }
        }

        async function processTransaction(type) {
            let amount = document.getElementById('pay-amount').value;
            let method = document.getElementById('pay-method').value;
            let res = await fetch('/api/transaction', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser, amount, type, method })
            });
            let data = await res.json();
            if (data.success) {
                document.getElementById('balance-display').innerText = data.balance;
                document.getElementById('pay-msg').innerText = data.message;
            } else {
                document.getElementById('pay-msg').innerText = data.error;
            }
        }
        socket.on('game_state', (data) => {
            document.getElementById('game-screen').innerText = data.multiplier + 'x';
            if (data.state === 'WAITING') {
                document.getElementById('status-text').innerText = 'Taphi itti aanuuf qophaa\'aa jira...';
            } else if (data.state === 'RUNNING') {
                document.getElementById('status-text').innerText = 'Xiyyaari balali' + 'ira jira!';
            } else if (data.state === 'CRASHED') {
                document.getElementById('status-text').innerText = 'Crashed! Taphi cufameera.';
            }
        });
    </script>

</body>

</html>
