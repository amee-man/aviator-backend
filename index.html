<!DOCTYPE html>
<html lang="om">

<head>
    <meta charset="UTF-8">
    <title>Aviator Engine Pro - Deluxe Edition</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-wrapper {
            display: flex;
            gap: 20px;
            width: 850px;
        }

        .game-card {
            background: #151c2c;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            flex: 1;
            border: 1px solid #232d42;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .balance-box {
            background: #0b0f19;
            padding: 8px 15px;
            border-radius: 10px;
            color: #4ade80;
            font-weight: bold;
            border: 1px solid #22c55e;
        }

        .history-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            margin-bottom: 12px;
        }

        .history-item {
            background: #0b0f19;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #232d42;
        }

        .high-multiplier {
            color: #38bdf8;
            border-color: #0284c7;
        }

        .low-multiplier {
            color: #f43f5e;
            border-color: #e11d48;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 220px;
            background: radial-gradient(circle at bottom left, #1e1b4b, #0b0f19);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2e2a72;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 55px;
            color: #38bdf8;
            font-weight: 800;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            pointer-events: none;
        }

        #status {
            font-size: 13px;
            color: #94a3b8;
            height: 18px;
            margin: 10px 0;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        input {
            width: 90px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0b0f19;
            color: #fff;
            font-weight: bold;
            text-align: center;
            font-size: 16px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            color: white;
            transition: 0.2s;
        }

        .btn-bet {
            background: #22c55e;
        }

        .btn-bet:hover {
            background: #16a34a;
        }

        .btn-cashout {
            background: #f97316;
        }

        .btn-cashout:hover {
            background: #ea580c;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Live Bets Sidebar */
        .bets-card {
            width: 280px;
            background: #151c2c;
            border-radius: 20px;
            padding: 15px;
            border: 1px solid #232d42;
            display: flex;
            flex-direction: column;
        }

        .bets-card h4 {
            margin: 0 0 10px 0;
            color: #94a3b8;
            font-size: 14px;
        }

        .bets-list {
            flex: 1;
            overflow-y: auto;
            max-height: 350px;
        }

        .bet-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 8px;
            font-size: 12px;
            border-bottom: 1px solid #1e293b;
            border-radius: 4px;
        }

        .bet-row.cashed {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
        }
    </style>
</head>

<body>

    <div class="main-wrapper">
        <!-- Live Bets Table -->
        <div class="bets-card">
            <h4>TAPATTOOTA LIVE</h4>
            <div class="bets-list" id="betsList"></div>
        </div>

        <!-- Main Engine Container -->
        <div class="game-card">
            <div class="header">
                <h3 style="margin:0; color:#cbd5e1;">Aviator Engine</h3>
                <div class="balance-box">$<span id="balance">100.00</span></div>
            </div>

            <div class="history-bar" id="historyBar"></div>

            <div class="canvas-container">
                <canvas id="gameCanvas"></canvas>
                <div id="display">1.00x</div>
            </div>

            <div id="status">Round Haaraa Eeggadhu...</div>

            <div class="controls">
                <input type="number" id="betAmount" value="10" min="1">
                <button id="actionBtn" class="btn btn-bet" onclick="handleAction()">BET</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io('http://localhost:3000');
        const display = document.getElementById('display');
        const status = document.getElementById('status');
        const actionBtn = document.getElementById('actionBtn');
        const balanceEl = document.getElementById('balance');
        const betInput = document.getElementById('betAmount');
        const historyBar = document.getElementById('historyBar');
        const betsList = document.getElementById('betsList');

        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;

        let isBetted = false;
        let currentBet = 0;
        let currentMultiplier = 1.00;
        let isCrashed = false;

        // Audio Context (Synthesizer Sound Effects)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeepSound(freq, duration) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) { }
        }

        function playCrashSound() {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) { }
        }

        // Draw Canvas Curve and Plane
        function drawCanvas(mult) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const w = canvas.width;
            const h = canvas.height;

            const progress = Math.min(1, (mult - 1) / 3);
            const endX = 30 + progress * (w - 80);
            const endY = h - 20 - progress * (h - 60);

            // Red Curve Line
            ctx.beginPath();
            ctx.moveTo(0, h);
            ctx.quadraticCurveTo(endX / 2, h, endX, endY);
            ctx.strokeStyle = isCrashed ? '#ef4444' : '#ff0055';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Fill Area Under Curve
            ctx.lineTo(endX, h);
            ctx.lineTo(0, h);
            ctx.fillStyle = isCrashed ? 'rgba(239, 68, 68, 0.1)' : 'rgba(255, 0, 85, 0.15)';
            ctx.fill();

            // Draw Airplane Emoji ✈️
            if (!isCrashed) {
                ctx.font = '28px sans-serif';
                ctx.fillText('✈️', endX - 10, endY + 10);
            }
        }

        function renderHistory(list) {
            historyBar.innerHTML = '';
            list.forEach(val => {
                const item = document.createElement('div');
                item.className = 'history-item ' + (parseFloat(val) >= 2.0 ? 'high-multiplier' : 'low-multiplier');
                item.innerText = val + 'x';
                historyBar.appendChild(item);
            });
        }

        function renderBets(bets) {
            betsList.innerHTML = '';
            bets.forEach(b => {
                const row = document.createElement('div');
                row.className = 'bet-row ' + (b.cashedOut ? 'cashed' : '');
                row.innerHTML = `
                    <span>${b.user}</span>
                    <span>$${b.amount}</span>
                    <span>${b.cashedOut ? b.cashoutMultiplier + 'x ($' + b.winAmount + ')' : 'Running...'}</span>
                `;
                betsList.appendChild(row);
            });
        }

        socket.on('init_history', (data) => { renderHistory(data.history); });
        socket.on('update_balance', (data) => { balanceEl.innerText = data.balance.toFixed(2); });

        socket.on('multiplier_update', (data) => {
            currentMultiplier = data.multiplier;
            display.innerText = currentMultiplier.toFixed(2) + 'x';
            display.style.color = "#38bdf8";

            isCrashed = false;
            drawCanvas(currentMultiplier);
            if (data.bets) renderBets(data.bets);

            playBeepSound(200 + currentMultiplier * 50, 0.05);

            if (isBetted) {
                actionBtn.innerText = 'CASH OUT ($' + (currentBet * currentMultiplier).toFixed(2) + ')';
                actionBtn.className = 'btn btn-cashout';
                actionBtn.disabled = false;
            }
        });

        socket.on('game_crashed', (data) => {
            isCrashed = true;
            display.innerText = 'CRASHED ' + data.crashPoint + 'x';
            display.style.color = "#ef4444";
            status.innerText = "Round itti aanuu eeggadhu...";

            drawCanvas(currentMultiplier);
            playCrashSound();

            if (data.history) renderHistory(data.history);
            if (data.bets) renderBets(data.bets);

            resetButton();
            isBetted = false;
        });

        socket.on('game_started', (data) => {
            isCrashed = false;
            status.innerText = "Taphni Eegaleera!";
            if (data.bets) renderBets(data.bets);
            drawCanvas(1.00);
        });

        function handleAction() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (!isBetted) {
                const amount = parseFloat(betInput.value);
                socket.emit('place_bet', { amount });
            } else {
                socket.emit('cash_out', { betAmount: currentBet });
            }
        }

        socket.on('bet_placed', (data) => {
            isBetted = true;
            currentBet = data.amount;
            actionBtn.innerText = 'QABSIFRAMEERA...';
            actionBtn.disabled = true;
            status.innerText = "Round-ni jalqabamuu eeggachaa jira...";
        });

        socket.on('cash_out_success', (data) => {
            playBeepSound(800, 0.2);
            alert('Moo\'atteerta! $' + data.winAmount.toFixed(2));
            isBetted = false;
            resetButton();
        });

        socket.on('error_msg', (data) => { alert(data.message); });

        function resetButton() {
            actionBtn.innerText = 'BET';
            actionBtn.className = 'btn btn-bet';
            actionBtn.disabled = false;
        }

        drawCanvas(1.00);
    </script>
</body>

</html>
